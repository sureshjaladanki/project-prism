[project]
name = "prism"
version = "0.1.0"
description = "Civic CMS: templates rendered at an immutable data vintage."
readme = "README.md"
requires-python = ">=3.12,<4"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=17.0.0",
    "pydantic>=2.0,<3",
    "duckdb>=1.2.0",
    "markdown>=3.7",
    "pyyaml>=6.0.2",
    "typer>=0.27.2",
    "tzdata>=2024.1",
]

[project.scripts]
prism = "prism.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.13.0",
    "mypy>=1.13.0",
    "types-Markdown>=3.7.0",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cms_render: needs a real Astro render of C1 (CMS Engineer)",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["prism"]
strict = true
plugins = ["pydantic.mypy"]
