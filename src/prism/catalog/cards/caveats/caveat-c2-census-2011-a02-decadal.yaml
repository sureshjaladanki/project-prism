caveat_id: caveat-c2-census-2011-a02-decadal
concept: 'Census of India 2011 Table A-02: population by census year 1901–2011 and
  variation since the preceding census for INDIA and States/UTs as printed.'
unit: Persons, and producer-printed decadal variation (absolute and percentage). N.A.
  cells are not zero.
population: Census enumerated population on District Code 000 India/State/UT rows.
  Not districts. Missing early years are missing observations, not dropped States.
reference_period: Census years on the row (1901 through 2011). 2011 is the last year.
producer_definition: Table A-2 as printed; State rows use District Code 000 (ORGI,
  NADA catalog 43333, 00 A 2-India.xls). Footnote marks stay on the printed name.
comparable_from: Where the producer prints a number for that census year on that unit.
  Pipeline keys State Code, not spelling versus Frame A.
breaks: Same 2011 map holes as Frame A. Do not stitch Card 5 projections onto this
  1901–2011 line as one census run.
lags: 'Same Census hole as Card 1: no published census year after 2011 on these cards.'
disagrees_with: Card 1 PCA. Cards 3–4 SRS 2024. Card 5 projections. CRS (rejected).
do_not: Do not extend the line past 2011 with Table 8 or SRS. Do not chart N.A. as
  0. Do not spelling-merge Frame B names with Frame A. Do not call 2011 current.
