# C2 citizen template bindings. Content Editor. No observation numerals.
# UI/UX Developer: bind each slot with prism.schema.SlotSelector against vintage
# dv-20260919-87b702f1fd66. Fail the render if a required observation slot
# would show a number without producer, series, date, geography vintage, and caveat.
# Missing observation → unknown / not published. Never paste a remembered figure.
# Do not move citizen_pointer.

template_id: c2-people-of-india
charter: C2
display_timezone: Asia/Kolkata
state_ut_axis_order: alphabetical_official_english_name
citizen_pointer: untouched

period_roles:
  census_2011:
    label: 1 March 2011
  srs_2024:
    label: calendar year 2024
  projection_2011:
    label: 1 March 2011 (projected)
  projection_2026:
    label: 1 March 2026 (projected)

frames:
  c2-frame-a:
    series: [census-2011-pca-sd]
    units_included_note: 00 India plus 35 STATE/UT labels on the 2011 map
    units_missing:
      - Telangana as a STATE row
      - Ladakh as a UT row
      - districts and below (parked)
      - merged Dadra and Nagar Haveli and Daman and Diu as one row
  c2-frame-b:
    series: [census-2011-a02-decadal]
    units_included: ["00"]
    units_missing:
      - same 2011 map holes as Frame A
  c2-frame-c:
    series: [srs-bulletin-2024]
    units_included: [india]
    units_missing:
      - districts and below (parked)
  c2-frame-d:
    series: [srs-statistical-report-2024]
    units_included: [india]
    units_missing:
      - smaller States and Union Territories not on Table 3
      - districts; NSS Natural Division rows (parked)
  c2-frame-e:
    series: [ncp-projections-2011-2036-table8]
    units_included: [india]
    units_missing:
      - districts (not in Table 8)

sector_order: [Rural, Urban, Total]

state_ut_order:
  - {code: "35", name_en: ANDAMAN & NICOBAR ISLANDS}
  - {code: "28", name_en: ANDHRA PRADESH}
  - {code: "12", name_en: ARUNACHAL PRADESH}
  - {code: "18", name_en: ASSAM}
  - {code: "10", name_en: BIHAR}
  - {code: "04", name_en: CHANDIGARH}
  - {code: "22", name_en: CHHATTISGARH}
  - {code: "26", name_en: DADRA & NAGAR HAVELI}
  - {code: "25", name_en: DAMAN & DIU}
  - {code: "30", name_en: GOA}
  - {code: "24", name_en: GUJARAT}
  - {code: "06", name_en: HARYANA}
  - {code: "02", name_en: HIMACHAL PRADESH}
  - {code: "01", name_en: JAMMU & KASHMIR}
  - {code: "20", name_en: JHARKHAND}
