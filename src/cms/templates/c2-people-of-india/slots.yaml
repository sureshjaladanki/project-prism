    field: population

  - slot_id: chart-india-residence-2011
    kind: collection
    chart: india-residence-2011
    members:
      - slot_id: india-rural-persons-2011
        label: Rural
      - slot_id: india-urban-persons-2011
        label: Urban
      - slot_id: india-total-persons-2011
        label: Total
    sort:
      field: label
      order: [Rural, Urban, Total]
      never: measure

  - slot_id: chart-state-ut-total-2011
    kind: collection
    chart: state-ut-total-2011
    citation_id: cite-c2-census-2011-pca-sd
    caveat_id: caveat-c2-census-2011-pca-sd
    selector:
      series_id: census-2011-pca-sd
      geography_codes: state_ut_order
      geography_vintage: "2011"
      code_system: census
      sector: Total
      reference_period: "2011-03-01"
      unit: persons
      status: value
    exclude_geography_codes: ["00"]
    sort:
      field: geography_name_en
      order: ascending
      never: measure

  - slot_id: chart-india-census-years-1901-2011
    kind: collection
    chart: india-census-years-1901-2011
    citation_id: cite-c2-census-2011-a02-decadal
    caveat_id: caveat-c2-census-2011-a02-decadal
