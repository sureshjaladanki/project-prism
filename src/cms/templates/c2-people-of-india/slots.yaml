a02_india_years:
  - "1901 $"
  - "1911"
  - "1921"
  - "1931 $"
  - "1941 $"
  - "1951 @"
  - "1961 @"
  - "1971"
  - "1981 #"
  - "1991 +"
  - "2001 ++"
  - "2011"

serve:
  observation: prism.schema.ServedObservation
  never_serve_bare_float: true

charts:
  india-residence-2011: ./charts/india-residence-2011.vl.json
  state-ut-total-2011: ./charts/state-ut-total-2011.vl.json
  india-census-years-1901-2011: ./charts/india-census-years-1901-2011.vl.json
  india-srs-rates-2024: ./charts/india-srs-rates-2024.vl.json
  india-projected-2011-2036: ./charts/india-projected-2011-2036.vl.json

slots:

  - slot_id: india-total-persons-2011
    kind: observation
    required: true
    citation_id: cite-c2-census-2011-pca-sd
    caveat_id: caveat-c2-census-2011-pca-sd
    selector:
      series_id: census-2011-pca-sd
      geography_code: "00"
      geography_vintage: "2011"
      code_system: census
      sector: Total
      reference_period: "2011-03-01"
      unit: persons
      status: value

  - slot_id: india-rural-persons-2011
    kind: observation
    required: true
    citation_id: cite-c2-census-2011-pca-sd
    caveat_id: caveat-c2-census-2011-pca-sd
    selector:
      series_id: census-2011-pca-sd
      geography_code: "00"
      geography_vintage: "2011"
      code_system: census
      sector: Rural
      reference_period: "2011-03-01"
      unit: persons
