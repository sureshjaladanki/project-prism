      series_id: ncp-projections-2011-2036-table8
      geography_code: india
      geography_vintage: "2019"
      code_system: none
      sector: Persons
      reference_period:
        from: "2011"
        to: "2036"
      unit: "thousands ('000); projected; 1st March"
      status: value
    sort:
      field: reference_period
      never: measure
