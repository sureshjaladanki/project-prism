      geography_code: "00"
      geography_vintage: "2011"
      code_system: census
      sector: Total
      reference_period:
        - "1901 $"
        - "1911"
        - "1921"
        - "1931 $"
        - "1941 $"
        - "1951 @"
        - "1961 @"
        - "1971"
        - "1981 #"
        - "1991 +"
        - "2001 ++"
        - "2011"
      unit: persons
      status: [value, unknown]
    sort:
      field: reference_period
      never: measure

  - slot_id: chart-india-srs-rates-2024
