# C3 citizen template bindings. Content Editor. No observation numerals.
# UI/UX Developer: bind each slot with prism.schema.SlotSelector against vintage
# dv-20260918-846e99d0ca57. Fail the render if a required observation slot
# required observation slot would show a number without producer, series, date,
# geography vintage, and caveat. Missing observation → unknown / not published.
# Never paste a remembered figure. Do not move citizen_pointer.
#
# Pipeline (new vintage, same SlotSelector, no schema edit):
#   rupee columns: unit = "₹ crore; {line_label}"
#   monthly %:     unit = "% of BE; {line_label}" or "% of BE (COPPY); {line_label}"
#   Card 8 hole:   unit = "not a table" (already)
# Copy line_label from the derived table as printed. Do not recode. Do not
# invent a head. After that vintage exists, fill bound_vintage_id.

template_id: c3-union-money
charter: C3
bound_vintage_id: dv-20260918-846e99d0ca57
code_system: none
display_timezone: Asia/Kolkata
axis_order: producer_printed
citizen_pointer: untouched

period_roles:
  budget_estimates_2026_27:
    label: Budget Estimates 2026-27
    year_label: 2026-27
  revised_2025_26:
    label: Revised Estimates 2025-26
    year_label: 2025-26
  actuals_2024_25:
    label: Actuals 2024-25
    year_label: 2024-25
  annex1_actuals_from:
    label: 2017-18
  annex1_actuals_to:
    label: 2024-25
  finance_accounts_2024_25:
    label: 2024-25
  cga_monthly_upto_july_2026:
    label: April–July 2026

frames:
  c3-frame-a:
    series:
      - budget-2026-27-tax-revenue
      - budget-2026-27-non-tax-revenue
      - budget-2026-27-capital-receipts
      - budget-2026-27-annex1-trends-receipts
      - budget-2026-27-expenditure-stat1
      - budget-2026-27-deficit-statistics
      - budget-2026-27-liabilities
      - budget-2026-27-frbm-statements
      - budget-2026-27-afs
    units_included_note: one Union government unit as labelled on that card
    units_missing:
      - all States as own governments (C5)
      - all Union Territories as own governments (C5)
      - districts and below (parked)
      - local-body accounts
  c3-frame-b:
    series: [cga-monthly-glance-2026-07]
    units_included: [union-government]
    units_missing:
      - all States as own governments
      - all Union Territories as own governments
      - districts and below (parked)
  c3-frame-c:
    series: [cga-finance-accounts-2024-25-stat1]
    units_included: [union-government]
    geography_vintage: "2024"
    units_missing:
      - all States as own governments
      - all Union Territories as own governments
      - districts and below (parked)

tax_head_order:
  - {unit: "₹ crore; 1. Corporation Tax", name: Corporation tax}
  - {unit: "₹ crore; 2. Taxes on Income", name: Income tax other than corporation tax}
  - {unit: "₹ crore; 8.01 Central Goods and Services Tax (CGST)", name: CGST}
  - {unit: "₹ crore; 8.02 Integrated Goods and Services Tax (IGST)", name: IGST}
  - {unit: "₹ crore; 8.03 GST Compensation Cess", name: GST Compensation Cess}
  - {unit: "₹ crore; 5. Customs", name: Customs}
  - {unit: "₹ crore; 6. Union Excise Duties", name: Union excise duties}

deficit_order:
  - {unit: "₹ crore; 1. राजकोषीय घाटा 1. Fiscal Deficit", name: Fiscal deficit}
  - {unit: "₹ crore; 2. राजस्व घाटा 2. Revenue Deficit", name: Revenue deficit}
  - {unit: "₹ crore; 3. प्रभावी राजस्व घाटा 3. Effective Revenue Deficit", name: Effective revenue deficit}
  - {unit: "₹ crore; 4. प्राथमिक घाटा 4. Primary Deficit", name: Primary deficit}

annex1_actuals_order:
  - actual-2017-18
  - actual-2018-19
  - actual-2019-20
  - actual-2020-21
  - actual-2021-22
  - actual-2022-23
  - actual-2023-24
  - actual-2024-25

liabilities_actuals_order:
  - end-2021-2022
  - end-2022-2023
  - end-2023-24
  - end-2024-25

serve:
  observation: prism.schema.ServedObservation
  never_serve_bare_float: true
  unknown_copy: unknown / not a table

charts:
  collect-beside-spend: ./charts/collect-beside-spend.vl.json
  tax-heads-be: ./charts/tax-heads-be.vl.json
  spend-blocks-be: ./charts/spend-blocks-be.vl.json
  deficit-be: ./charts/deficit-be.vl.json
  liabilities-stock: ./charts/liabilities-stock.vl.json
