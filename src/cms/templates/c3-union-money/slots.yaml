    sort:
      field: deficit_order
      never: measure
    do_not:
      - grade FRBM targets
      - blend monthly fiscal deficit into this chart
      - sort by the measure

  - slot_id: chart-liabilities-actuals
    kind: collection
    chart: liabilities-stock
    layer: year_end_actuals
    citation_id: cite-c3-budget-2026-27-liabilities
    caveat_id: caveat-c3-budget-2026-27-liabilities
    selector:
      series_id: budget-2026-27-liabilities
      geography_code: central-government
      geography_vintage: "2026"
      code_system: none
      sector: Union
      reference_period:
