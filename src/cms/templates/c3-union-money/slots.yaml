        - end-2022-2023
        - end-2023-24
        - end-2024-25
      unit: "₹ crore; Total - Liabilities"
      status: value
    do_not:
      - splice 1950-51 into this run
      - connect Revised or Budget columns as Actuals
      - merge FRBM-defined debt

  - slot_id: chart-liabilities-estimates
    kind: collection
    chart: liabilities-stock
    layer: revised_and_budget
    citation_id: cite-c3-budget-2026-27-liabilities
    caveat_id: caveat-c3-budget-2026-27-liabilities
    selector:
      series_id: budget-2026-27-liabilities
      geography_code: central-government
      geography_vintage: "2026"
      code_system: none
