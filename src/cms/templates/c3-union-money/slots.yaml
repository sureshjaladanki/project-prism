    labels: tax_head_order
    on_unknown: hole_not_zero
    sort:
      field: tax_head_order
      never: measure
    do_not:
      - add these heads into a Prism collections total
      - chart a blank cess as zero
      - treat gross tax as tax after States’ share

  - slot_id: chart-spend-blocks-be
